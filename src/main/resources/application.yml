server:
  port: 8081

# Config Swagger
app:
  swagger:
    server-url: ${FLEET_SERVER_URL:https://traefikdev.yowyob.com/fleet-management}

spring:
  application:
    name: fleet-management

  # Secrets (clé API Kernel, mots de passe, jetons) : jamais dans le dépôt.
  # Ils sont lus depuis les variables d'environnement ou, en local, depuis le fichier
  # .env (ignoré par git) — copier .env.example en .env et le compléter.
  config:
    import: optional:file:.env[.properties]
  
  # Le front rejette les tokens fake-auth (« fake-token-… ») : profil kernel par défaut.
  # Auth simulée sans Kernel : SPRING_PROFILES_ACTIVE=local,demo,fake-auth
  profiles:
    active: local,demo

  # R2DBC (Application Runtime)

  r2dbc:
    url: r2dbc:postgresql://localhost:5433/fleetmanBD
    username: fleet_admin
    password: ${DB_PASSWORD}
    pool:
      enabled: true
      initial-size: 2
      max-size: 10
      validation-query: "SELECT 1"
      max-idle-time: 10m

  # JDBC (Liquibase Migration)
  datasource:
    url: jdbc:postgresql://localhost:5433/fleetmanBD
    username: fleet_admin
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # LIQUIBASE
  liquibase:
    url: jdbc:postgresql://localhost:5433/fleetmanBD
    user: fleet_admin
    password: ${DB_PASSWORD}
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public
    liquibase-schema: public
    enabled: true
    contexts: local 
  # REDIS
  data:
    redis:
      host: localhost
      port: 6380
      password: ${REDIS_PASSWORD:}

  # KAFKA
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: fleet-management-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  docker:
    compose:
      enabled: false

  # MAIL (SMTP) — emails transactionnels (rejet de souscription, etc.)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# CONFIG METIER
application:
  # ── Kernel RT-Comops ────────────────────────────────────────────────────────
  kernel:
    url: ${KERNEL_URL:https://kernel-core.yowyob.com/kernel-api}
    client-id: ${KERNEL_CLIENT_ID:fleet-management-backend}
    api-key: ${KERNEL_API_KEY:}
    tenant-id: ${KERNEL_TENANT_ID:f5b814d9-766e-4c87-91ec-d6c8e32cb56c}
    organization-id: ${KERNEL_ORG_ID:5e69f5c5-1f03-41cb-a4a3-d59188f73323}
    business-actor-id: ${KERNEL_BUSINESS_ACTOR_ID:54fb5d86-345e-4522-a247-5cbc1de510fc}
    organization-sync: ${KERNEL_ORG_SYNC:true}
    service: COMMERCIAL
    roles:
      # Surcharges optionnelles : si vides, résolues dynamiquement via
      # GET /api/administration/roles (voir KernelRoleRegistry).
      fleet-driver-id: ${KERNEL_ROLE_FLEET_DRIVER_ID:}
      fleet-manager-id: ${KERNEL_ROLE_FLEET_MANAGER_ID:}
      fleet-admin-id: ${KERNEL_ROLE_FLEET_ADMIN_ID:}
      fleet-super-admin-id: ${KERNEL_ROLE_FLEET_SUPER_ADMIN_ID:}

  file:
    mode: ${FILE_MODE:kernel}
  # Hub documentaire du Kernel (document-hub, document-governance) : local tant qu'il n'est pas branché.
  document:
    hub: ${DOCUMENT_HUB:local}

  # Envoi d'emails transactionnels (rejet de souscription)
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@fleetman.cm}}
    from-name: ${MAIL_FROM_NAME:FleetMan}

  external:
    vehicle-service-url:  https://traefikdev.yowyob.com/vehicule
    vehicle-mode: ${VEHICLE_MODE:kernel}
    geofence-service-url: https://traefikdev.yowyob.com/geofence-service
    payment-service-url:  https://traefikdev.yowyob.com/payment
  auth:
    mode: kernel
    url: https://kernel-core.yowyob.com/kernel-api/kernel-api
  notification:
    mode: http
    url: https://traefikdev.yowyob.com/notification
    service-token: ${NOTIFICATION_SERVICE_TOKEN:} # Jeton obtenu à l'enregistrement du service
    templates:
      new-offer: 1        # ID template: Nouvelle offre pour les chauffeurs
      driver-applied: 2   # ID template: Un chauffeur a postulé (pour le client)
      driver-selected: 3  # ID template: Vous avez été choisi (pour le chauffeur)
      ride-confirmed: 4   # ID template: Le chauffeur arrive (pour le client)
      ride-cancelled: 5   # ID template: Course annulée
      admin-validation: 7 # ID template: admin a validé le profil du driver
      maintenance-created: 8  # ID template: Nouvelle maintenance déclarée
      incident-reported: 9    # ID template: Incident signalé
      incident-critical: 10   # ID template: Incident CRITIQUE signalé
 
  geofence:
    enabled: false
  geofence-system-user:
    username: "system@fleetman.cm"
    password: ${GEOFENCE_SYSTEM_PASSWORD:}
    organization-id: "5e69f5c5-1f03-41cb-a4a3-d59188f73323"
 
  # Paiement des abonnements : « simulated » tant que le service de paiement n'est pas branché
  # (SimulatedSubscriptionPaymentAdapter, aucun encaissement). Le futur adaptateur réel
  # implémentera SubscriptionPaymentPort et s'activera avec une autre valeur.
  subscription:
    payment-mode: ${SUBSCRIPTION_PAYMENT_MODE:simulated}

  # Mot de passe démo commun du profil fake-auth et mot de passe initial d'un chauffeur
  # créé sans mot de passe : fournis par le fichier .env, jamais écrits ici.
  demo:
    password: ${DEMO_PASSWORD:}
  driver:
    default-password: ${DRIVER_DEFAULT_PASSWORD:}

  bootstrap:
    admin:
      username: "joeltaba4"
      email: "joeltaba4@gmail.com"
      # Identifiant de connexion Kernel : le Kernel n'accepte plus l'email personnel
      # au login, seulement l'identité Yowyob du compte.
      principal: ${KERNEL_OWNER_PRINCIPAL:pending-84064860b33bf7ba989885ba}
      password: ${KERNEL_OWNER_PASSWORD:}
      phone: "+237600000000"
      firstname: "Joel"
      lastname: "Taba"
  demo-data:
    enabled: false
  # Kafka topics
  kafka:
    topics:
      geofence-alerts: geofence-alerts-topic
      operation-events: operation-events-topic
      kernel-events: iwm.events.business
    kernel-events:
      enabled: ${KAFKA_KERNEL_EVENTS_ENABLED:true}

# MONITORING
management:
  endpoints:
    web:
      exposure:
        include: ["health","info","prometheus"]
  endpoint:
    health:
      show-details: "always"
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# Resilience4j
resilience4j:
  circuitbreaker:
    instances:
      kernel-auth:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
      kernel-organization:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
      kernel-resource:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
      kernel-file:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
      kernel-kyc:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
      kernel-actor:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
      kernel-notification:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
      notification:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
  timelimiter:
    instances:
      kernel-auth:
        timeoutDuration: 10s
      kernel-organization:
        timeoutDuration: 10s
      kernel-resource:
        timeoutDuration: 10s
      kernel-file:
        # 10s était trop court pour l'upload de photos volumineuses (véhicules,
        # documents scannés) depuis un smartphone — le timeout coupait la requête
        # avant la fin de l'upload vers Kernel, et kernelCallSupport.run() (sans
        # fallback dédié) transformait ça en réponse vide silencieuse côté client
        # au lieu d'une erreur claire. Alignée sur kernel-kyc qui gère le même
        # type de fichiers volumineux.
        timeoutDuration: 60s
      kernel-kyc:
        timeoutDuration: 180s
      kernel-actor:
        timeoutDuration: 10s
      kernel-notification:
        timeoutDuration: 10s

# Stockage fichiers (documents PDF / images)
fleetman:
  uploads:
    dir: uploads
    max-bytes: 10485760